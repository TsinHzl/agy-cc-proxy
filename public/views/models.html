<div x-data="models" class="view-container">
    <!-- PageHead（kiro2cc PageHead 规格） -->
    <div class="mb-5 flex flex-wrap items-end gap-4">
        <div class="min-w-0">
            <div class="mb-[5px] text-[11px] tracking-[.02em] text-ink-3">
                <span x-text="$store.global.t('systemDesc')">CLAUDE PROXY SYSTEM</span>&nbsp;/&nbsp;<b
                    class="font-medium text-ink-2" aria-hidden="true" x-text="$store.global.t('models')">Models</b>
            </div>
            <h1 class="text-[19px] font-semibold leading-[1.2] tracking-[-.02em]" x-text="$store.global.t('models')">
                Models
            </h1>
        </div>

        <!-- Search Bar（kiro2cc SearchBox 规格：h-31px + rounded-[7px] + brand focus） -->
        <div class="relative ml-auto w-[236px]">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                <svg class="h-3.5 w-3.5 text-ink-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text"
                :placeholder="$store.global.t('searchPlaceholder')"
                :aria-label="$store.global.t('searchPlaceholder')"
                class="input-search-sm pr-9"
                x-model.debounce="$store.data.filters.search"
                @input="$store.data.computeQuotaRows()">
            <button x-show="$store.data.filters.search"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="opacity-0 scale-75"
                    x-transition:enter-end="opacity-100 scale-100"
                    @click="$store.data.filters.search = ''; $store.data.computeQuotaRows()"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-ink-3 transition-colors hover:text-ink"
                    :aria-label="$store.global.t('searchPlaceholder')">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Toolbar（kiro2cc Toolbar 规格：SearchBox + Segmented + 切换钮） -->
    <div class="mb-4 flex flex-wrap items-center gap-2">
        <!-- Account Select -->
        <div class="relative min-w-[180px]">
            <select
                class="h-[31px] w-full cursor-pointer appearance-none truncate rounded-[7px] border border-hairline bg-surface pl-3 pr-8 text-[12px] font-medium text-ink-2 transition-colors hover:border-hairline-2 focus:border-brand focus:outline-none focus:ring-[3px] focus:ring-brand-soft"
                style="-webkit-appearance: none; -moz-appearance: none; background-image: none;"
                x-model="$store.data.filters.account" @change="$store.data.computeQuotaRows()">
                <option value="all" x-text="$store.global.t('allAccounts')">All Accounts</option>
                <template x-for="acc in $store.data.accounts" :key="acc.email">
                    <option :value="acc.email" x-text="Redact.email(acc.email).split('@')[0]"></option>
                </template>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-ink-3">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
        </div>

        <!-- Family Segmented（kiro2cc Segmented 规格） -->
        <div class="flex shrink-0 gap-0.5 rounded-[8px] bg-surface-3 p-0.5" role="radiogroup"
             :aria-label="$store.global.t('allCaps')">
            <button type="button"
                class="flex h-[27px] items-center gap-[5px] whitespace-nowrap rounded-[6px] px-2.5 text-[12px] transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
                :class="$store.data.filters.family === 'all'
                    ? 'bg-surface font-semibold text-ink shadow-hair'
                    : 'font-medium text-ink-2 hover:text-ink'"
                role="radio"
                :aria-checked="$store.data.filters.family === 'all' ? 'true' : 'false'"
                @click="$store.data.filters.family = 'all'; $store.data.computeQuotaRows()"
                x-text="$store.global.t('allCaps')">ALL</button>
            <button type="button"
                class="flex h-[27px] items-center gap-[5px] whitespace-nowrap rounded-[6px] px-2.5 text-[12px] transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
                :class="$store.data.filters.family === 'claude'
                    ? 'bg-surface font-semibold text-ink shadow-hair'
                    : 'font-medium text-ink-2 hover:text-ink'"
                role="radio"
                :aria-checked="$store.data.filters.family === 'claude' ? 'true' : 'false'"
                @click="$store.data.filters.family = 'claude'; $store.data.computeQuotaRows()"
                x-text="$store.global.t('claudeCaps')">CLAUDE</button>
            <button type="button"
                class="flex h-[27px] items-center gap-[5px] whitespace-nowrap rounded-[6px] px-2.5 text-[12px] transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
                :class="$store.data.filters.family === 'gemini'
                    ? 'bg-surface font-semibold text-ink shadow-hair'
                    : 'font-medium text-ink-2 hover:text-ink'"
                role="radio"
                :aria-checked="$store.data.filters.family === 'gemini' ? 'true' : 'false'"
                @click="$store.data.filters.family = 'gemini'; $store.data.computeQuotaRows()"
                x-text="$store.global.t('geminiCaps')">GEMINI</button>
        </div>

        <!-- Show Hidden Toggle -->
        <button type="button"
            class="inline-flex h-[31px] shrink-0 items-center gap-2 rounded-[7px] border px-3 text-[12px] font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
            :class="$store.settings.showHiddenModels
                ? 'border-brand-line bg-brand-soft text-brand'
                : 'border-hairline bg-surface text-ink-2 hover:bg-surface-3 hover:text-ink'"
            @click="$store.settings.toggle('showHiddenModels'); $store.data.computeQuotaRows()"
            :title="$store.settings.showHiddenModels ? $store.global.t('hideHidden') : $store.global.t('showHidden')">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
            <span class="text-[11px] font-medium uppercase tracking-wide" x-text="$store.settings.showHiddenModels ? $store.global.t('hiddenOn') : $store.global.t('hiddenOff')"></span>
        </button>

        <!-- Show All Accounts Toggle (only in detail mode) -->
        <button x-show="!$store.settings.compact" type="button"
            class="inline-flex h-[31px] shrink-0 items-center gap-2 rounded-[7px] border px-3 text-[12px] font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
            :class="$store.settings.showAllAccounts
                ? 'border-brand-line bg-brand-soft text-brand'
                : 'border-hairline bg-surface text-ink-2 hover:bg-surface-3 hover:text-ink'"
            @click="$store.settings.toggle('showAllAccounts')"
            :title="$store.settings.showAllAccounts ? 'Cap account rows' : 'Show all account rows'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="text-[11px] font-medium uppercase tracking-wide" x-text="$store.settings.showAllAccounts ? 'All' : 'Capped'"></span>
        </button>
    </div>

    <!-- Main Table（kiro2cc table-kit PANEL 规格） -->
    <section class="flex min-h-0 flex-col overflow-hidden rounded-[11px] border border-hairline bg-surface shadow-panel">
        <div class="min-h-0 overflow-x-auto">
            <table class="w-full border-collapse text-[12.5px]"
                :class="$store.settings.compact ? 'text-xs' : ''">
            <thead>
                <tr>
                    <th class="sticky top-0 z-[2] w-14 whitespace-nowrap border-b border-hairline bg-surface-2 px-3 py-[9px] text-left text-[10.5px] font-semibold uppercase tracking-[0.07em] text-ink-3"
                        x-text="$store.global.t('stat')">Stat</th>
                    <th class="group sticky top-0 z-[2] min-w-[200px] cursor-pointer select-none whitespace-nowrap border-b border-hairline bg-surface-2 px-3 py-[9px] text-left text-[10.5px] font-semibold uppercase tracking-[0.07em] text-ink-3 transition-colors hover:text-ink"
                        @click="$store.data.setSort('modelId')">
                        <div class="flex items-center gap-1">
                            <span x-text="$store.global.t('modelIdentity')">Model Identity</span>
                            <svg class="h-3 w-3 transition-colors"
                                :class="$store.data.filters.sortCol === 'modelId' ? 'text-brand' : 'text-ink-3 opacity-0 group-hover:opacity-100'"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    :d="$store.data.filters.sortCol === 'modelId' ? ($store.data.filters.sortAsc ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7') : 'M8 9l4-4 4 4m0 6l-4 4-4-4'" />
                            </svg>
                        </div>
                    </th>
                    <th class="group sticky top-0 z-[2] min-w-[12rem] cursor-pointer select-none whitespace-nowrap border-b border-hairline bg-surface-2 px-3 py-[9px] text-left text-[10.5px] font-semibold uppercase tracking-[0.07em] text-ink-3 transition-colors hover:text-ink"
                        @click="$store.data.setSort('avgQuota')">
                        <div class="flex items-center gap-1">
                            <span x-text="$store.global.t('globalQuota')">Global Quota</span>
                            <svg class="h-3 w-3 transition-colors"
                                :class="$store.data.filters.sortCol === 'avgQuota' ? 'text-brand' : 'text-ink-3 opacity-0 group-hover:opacity-100'"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    :d="$store.data.filters.sortCol === 'avgQuota' ? ($store.data.filters.sortAsc ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7') : 'M8 9l4-4 4 4m0 6l-4 4-4-4'" />
                            </svg>
                        </div>
                    </th>
                    <th x-show="!$store.settings.compact"
                        class="group sticky top-0 z-[2] min-w-[8rem] cursor-pointer select-none whitespace-nowrap border-b border-hairline bg-surface-2 px-3 py-[9px] text-left text-[10.5px] font-semibold uppercase tracking-[0.07em] text-ink-3 transition-colors hover:text-ink"
                        @click="$store.data.setSort('minResetTime')">
                        <div class="flex items-center gap-1">
                            <span x-text="$store.global.t('nextReset')">Next Reset</span>
                            <svg class="h-3 w-3 transition-colors"
                                :class="$store.data.filters.sortCol === 'minResetTime' ? 'text-brand' : 'text-ink-3 opacity-0 group-hover:opacity-100'"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    :d="$store.data.filters.sortCol === 'minResetTime' ? ($store.data.filters.sortAsc ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7') : 'M8 9l4-4 4 4m0 6l-4 4-4-4'" />
                            </svg>
                        </div>
                    </th>
                    <th x-show="!$store.settings.compact"
                        class="group sticky top-0 z-[2] cursor-pointer select-none whitespace-nowrap border-b border-hairline bg-surface-2 px-3 py-[9px] text-left text-[10.5px] font-semibold uppercase tracking-[0.07em] text-ink-3 transition-colors hover:text-ink"
                        @click="$store.data.setSort('activeCount')">
                        <div class="flex items-center gap-1 justify-start">
                            <span x-text="$store.global.t('distribution')">Account Distribution</span>
                            <svg class="h-3 w-3 transition-colors"
                                :class="$store.data.filters.sortCol === 'activeCount' ? 'text-brand' : 'text-ink-3 opacity-0 group-hover:opacity-100'"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    :d="$store.data.filters.sortCol === 'activeCount' ? ($store.data.filters.sortAsc ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7') : 'M8 9l4-4 4 4m0 6l-4 4-4-4'" />
                            </svg>
                        </div>
                    </th>
                    <th class="sticky top-0 z-[2] w-20 whitespace-nowrap border-b border-hairline bg-surface-2 px-3 py-[9px] text-right text-[10.5px] font-semibold uppercase tracking-[0.07em] text-ink-3"
                        x-text="$store.global.t('actions')">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Pinned rows（保持排序首位，不设分组行） -->
                <template x-for="row in $store.data.quotaRows.filter(r => r.pinned)" :key="row.modelId">
                    <tr class="group transition-colors hover:bg-surface-2 [&>td]:border-b [&>td]:border-hairline [&:last-child>td]:border-b-0"
                        :class="row.hidden ? 'opacity-50 grayscale hover:opacity-100 hover:grayscale-0' : ''">
                        <td class="border-b border-hairline px-3 py-[11px] align-middle">
                            <div class="h-2 w-2 rounded-full transition-all duration-500"
                                :class="row.avgQuota > 0 ? 'bg-ok' : 'bg-danger'"></div>
                        </td>
                        <td class="border-b border-hairline px-3 py-[11px] align-middle">
                            <div class="flex min-w-0 flex-col gap-[3px]">
                                <div class="truncate font-mono text-[12px] text-ink"
                                    :class="$store.settings.compact ? 'text-[11px]' : ''"
                                    x-text="row.modelId"></div>
                                <div class="text-[11px] text-ink-3"
                                    x-show="!$store.settings.compact"
                                    x-text="$store.global.t('family' + row.family.charAt(0).toUpperCase() + row.family.slice(1))"></div>
                            </div>
                        </td>
                        <td class="border-b border-hairline px-3 py-[11px] align-middle">
                            <div class="flex flex-col pr-4"
                                 :class="$store.settings.compact ? 'gap-0.5' : 'gap-1'">
                                <div class="flex justify-between font-mono text-[12px]">
                                    <span class="flex items-center gap-1.5">
                                        <span class="font-semibold tabular-nums"
                                            :class="row.avgQuota > 0 ? 'text-ink' : 'text-danger'"
                                            x-text="row.avgQuota + '%'"></span>
                                        <!-- Threshold indicator (inline) -->
                                        <span x-show="row.effectiveThresholdPct > 0"
                                              class="text-[10px] text-ink-3"
                                              x-text="row.hasVariedThresholds && row.quotaInfo.some(q => q.thresholdPct > 0)
                                                  ? '· min ' + Math.min(...row.quotaInfo.map(q => q.thresholdPct).filter(t => t > 0)) + '–' + row.effectiveThresholdPct + '%'
                                                  : '· min ' + row.effectiveThresholdPct + '%'"></span>
                                        <!-- Inline reset time (compact only) -->
                                        <span x-show="$store.settings.compact && row.resetIn && row.resetIn !== '-'"
                                              class="text-[10px]"
                                              :class="row.resetIn.indexOf('h') === -1 ? 'text-brand font-semibold' : 'text-ink-3'"
                                              x-text="'· ' + row.resetIn"></span>
                                    </span>
                                    <span class="flex items-center gap-2">
                                        <!-- Compact: inline account squares -->
                                        <span x-show="$store.settings.compact && row.quotaInfo && row.quotaInfo.length > 0"
                                              class="inline-flex gap-0.5 items-center">
                                            <template x-for="q in row.quotaInfo.slice(0, 8)" :key="q.fullEmail + '-sq'">
                                                <span class="inline-block h-1.5 w-1.5 rounded-[2px]"
                                                      :class="q.pct > 50 ? 'bg-ok' : (q.pct > 0 ? 'bg-warn' : 'bg-danger')"></span>
                                            </template>
                                            <span x-show="row.quotaInfo.length > 8"
                                                  class="text-[9px] leading-none text-ink-3"
                                                  x-text="'+' + (row.quotaInfo.length - 8)"></span>
                                        </span>
                                        <!-- Available/Total Accounts Indicator -->
                                        <span class="text-[10px] tabular-nums text-ink-3"
                                              x-text="row.quotaInfo.filter(q => q.pct > 0).length + '/' + row.quotaInfo.length"></span>
                                    </span>
                                </div>
                                <div class="relative">
                                    <div class="quota-bar"
                                         :class="$store.settings.compact ? '' : 'h-1.5'">
                                        <div class="transition-all duration-500"
                                             :class="row.avgQuota > 60 ? 'quota-tier-safe' : (row.avgQuota > 30 ? 'quota-tier-mod' : (row.avgQuota > 15 ? 'quota-tier-warn' : 'quota-tier-danger'))"
                                             :style="'width: ' + (row.avgQuota ?? 0) + '%'"></div>
                                    </div>
                                    <!-- Per-account draggable quota threshold markers -->
                                    <template x-for="(q, qIdx) in row.quotaInfo.filter(q => q.thresholdPct > 0 || isDragging(q, row))" :key="q.fullEmail + '-threshold'">
                                        <div class="absolute -top-1 -bottom-1 group/marker"
                                             :class="isDragging(q, row) ? 'cursor-grabbing z-30' : 'cursor-grab'"
                                             :style="'left: calc(' + getMarkerPct(q, row) + '% - 4px); width: 9px; transform: translateX(' + (isDragging(q, row) ? '0px' : getMarkerOffset(q, row, qIdx)) + ');'"
                                             :title="Redact.email(q.email) + ' min: ' + getMarkerPct(q, row) + '%'"
                                             @mousedown.prevent="startDrag($event, q, row)"
                                             @touchstart.prevent="startDrag($event, q, row)">
                                            <!-- Visible marker line -->
                                            <div class="absolute left-1 top-1 bottom-1 w-[3px] rounded-full"
                                                 :class="isDragging(q, row) ? 'scale-y-150 brightness-150' : 'transition-all group-hover/marker:scale-y-150 group-hover/marker:brightness-125'"
                                                 :style="'background-color: ' + getThresholdColor(qIdx).bg + '; box-shadow: 0 0 ' + (isDragging(q, row) ? '10px' : '6px') + ' ' + getThresholdColor(qIdx).shadow"></div>
                                            <!-- Tooltip popup (visible on hover or during drag) -->
                                            <div class="absolute -top-8 left-1/2 -translate-x-1/2 items-center gap-1.5
                                                         whitespace-nowrap rounded-md font-mono text-xs font-semibold px-2.5 py-1 shadow-pop z-20 bg-space-950 border border-hairline"
                                                 :class="isDragging(q, row) ? 'flex' : 'hidden group-hover/marker:flex'"
                                                 :style="'color: ' + getThresholdColor(qIdx).bg + '; border-color: ' + getThresholdColor(qIdx).bg + '40'">
                                                <span class="h-2 w-2 flex-shrink-0 rounded-full" :style="'background-color: ' + getThresholdColor(qIdx).bg"></span>
                                                <span x-text="Redact.email(q.email)"></span>
                                                <span class="text-ink-3">min</span>
                                                <span x-text="getMarkerPct(q, row) + '%'"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                                <!-- Per-account breakdown (non-compact only) -->
                                <div x-show="!$store.settings.compact && row.quotaInfo && row.quotaInfo.length > 1"
                                     class="mt-1 flex flex-col gap-1 border-t border-hairline pt-1">
                                    <template x-for="q in getVisibleAccounts(row)" :key="q.fullEmail + '-detail'">
                                        <div class="flex items-center gap-2">
                                            <span class="w-20 flex-shrink-0 truncate text-right font-mono text-[10px] text-ink-3"
                                                  x-text="Redact.email(q.email)"></span>
                                            <div class="quota-bar flex-1">
                                                <div class="transition-all duration-500"
                                                     :class="q.pct > 60 ? 'quota-tier-safe' : (q.pct > 30 ? 'quota-tier-mod' : (q.pct > 15 ? 'quota-tier-warn' : 'quota-tier-danger'))"
                                                     :style="'width: ' + q.pct + '%'"></div>
                                            </div>
                                            <span class="w-8 flex-shrink-0 text-right font-mono text-[10px] tabular-nums"
                                                  :class="q.pct > 0 ? 'text-ink-2' : 'text-danger'"
                                                  x-text="q.pct + '%'"></span>
                                            <span x-show="q.resetTime"
                                                  class="w-12 flex-shrink-0 text-right font-mono text-[9px] text-ink-3"
                                                  x-text="window.utils.formatTimeUntil(q.resetTime)"></span>
                                        </div>
                                    </template>
                                    <!-- "+N more" expand button -->
                                    <button x-show="getHiddenCount(row) > 0"
                                            @click="toggleExpanded(row.modelId)"
                                            class="cursor-pointer py-0.5 pl-[88px] text-left font-mono text-[10px] text-brand opacity-80 transition-colors hover:opacity-100"
                                            x-text="'+' + getHiddenCount(row) + ' more'"></button>
                                    <!-- "Show less" collapse button -->
                                    <button x-show="isExpanded(row.modelId) && !$store.settings.showAllAccounts && row.quotaInfo.length > window.AppConstants.LIMITS.ACCOUNT_BREAKDOWN_LIMIT"
                                            @click="toggleExpanded(row.modelId)"
                                            class="cursor-pointer py-0.5 pl-[88px] text-left font-mono text-[10px] text-ink-3 transition-colors hover:text-ink-2">Show less</button>
                                </div>
                            </div>
                        </td>
                        <td x-show="!$store.settings.compact" class="border-b border-hairline px-3 py-[11px] align-middle font-mono text-[12px]">
                            <div class="tooltip tooltip-left"
                                 :data-tip="row.quotaInfo && row.quotaInfo.length > 0 ? row.quotaInfo.filter(q => q.resetTime).map(q => Redact.email(q.email) + ': ' + q.resetTime).join('\n') : 'No reset data'">
                                <span class="tabular-nums"
                                    x-text="row.resetIn"
                                    :class="(row.resetIn && row.resetIn.indexOf('h') === -1 && row.resetIn !== '-') ? 'font-semibold text-brand' : 'text-ink-2'"></span>
                            </div>
                        </td>
                        <td x-show="!$store.settings.compact" class="border-b border-hairline px-3 py-[11px] align-middle">
                            <div class="flex items-center justify-start gap-3">
                                <div class="hidden text-left font-mono text-[10px] leading-tight text-ink-3 opacity-80 xl:block">
                                    <div
                                        x-text="$store.global.t('activeCount', {count: row.quotaInfo?.filter(q => q.pct > 0).length || 0})">
                                    </div>
                                </div>
                                <!-- Account Status Indicators -->
                                <div class="flex max-w-[200px] flex-wrap gap-1 justify-start" x-data="{ maxVisible: 12 }">
                                    <template x-if="!row.quotaInfo || row.quotaInfo.length === 0">

                                                fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">

                                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                            </svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </template>

                <!-- Loading（kiro2cc 空态规格） -->
                <template x-if="$store.data.loading && !$store.data.quotaRows.length">
                    <tr>
                        <td :colspan="$store.settings.compact ? 4 : 6" class="px-3 py-14">
                            <div class="flex flex-col items-center gap-2.5 text-ink-3">
                                <svg class="size-6 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="3" stroke="currentColor" fill="none"></circle>
                                    <path class="opacity-75" d="M12 2a10 10 0 0110 10" stroke-width="3" stroke="currentColor" fill="none" stroke-linecap="round"></path>
                                </svg>
                                <span class="text-[12.5px]"
                                    x-text="$store.global.t('establishingUplink')">ESTABLISHING
                                    UPLINK...</span>
                            </div>
                        </td>
                    </tr>
                </template>
                <!-- Empty State（kiro2cc 空态规格） -->
                <template x-if="!$store.data.initialLoad && !$store.data.loading && $store.data.quotaRows.length === 0">
                    <tr>
                        <td :colspan="$store.settings.compact ? 4 : 6" class="px-3 py-14">
                            <div class="mx-auto flex max-w-lg flex-col items-center gap-2.5 text-ink-3">
                                <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                          d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                                </svg>
                                <span class="text-[12.5px] font-medium text-ink-2" x-text="$store.global.t('noSignal')">
                                    NO SIGNAL DETECTED
                                </span>
                                <p class="max-w-md text-[12.5px] leading-relaxed">
                                    No model data available. Add accounts to see available models and quota information.
                                </p>
                                <button type="button"
                                    class="btn-primary mt-1.5 gap-2"
                                    @click="$store.global.activeTab = 'accounts'">
                                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                    </svg>
                                    <span x-text="$store.global.t('goToAccounts')">Go to Accounts</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        </div>

        <!-- Panel Foot（kiro2cc PANEL_FOOT 规格） -->
        <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1.5 border-t border-hairline bg-surface-2 px-[13px] py-[9px] text-[11.5px] text-ink-3">
            <span x-text="$store.global.t('modelsPageDesc')">Real-time quota and status for all available models.</span>
            <span class="ml-auto font-mono tabular-nums" x-text="$store.data.quotaRows.length"></span>
        </div>
    </section>
</div>
