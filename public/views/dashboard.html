<div x-data="dashboard" class="view-container">
    <!-- PageHead -->
    <div class="mb-5 flex flex-wrap items-end gap-4">
        <div class="min-w-0">
            <div class="mb-[5px] text-[11px] tracking-[.02em] text-ink-3">
                <span x-text="$store.global.t('systemDesc')">CLAUDE PROXY SYSTEM</span>&nbsp;/&nbsp;<b
                    class="font-medium text-ink-2" aria-hidden="true" x-text="$store.global.t('dashboard')">Dashboard</b>
            </div>
            <h1 class="text-[19px] font-semibold leading-[1.2] tracking-[-.02em]" x-text="$store.global.t('dashboard')">
                Dashboard
            </h1>
        </div>

        <!-- Live Status (kiro2cc side-foot spec) -->
        <div class="ml-auto flex flex-wrap items-center justify-end gap-2">
            <div class="flex items-center gap-2 whitespace-nowrap text-[11px] text-ink-3">
                <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-ok ring-[3px] ring-ok-soft"></span>
                <span x-text="$store.global.t('live')">Live</span>
                <span class="h-[9px] w-px shrink-0 bg-hairline-2" aria-hidden="true"></span>
                <span class="tabular-nums"
                    x-text="new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'})">
                </span>
            </div>
        </div>
    </div>

    <!-- Claude Config Warning Banner -->
    <div x-cloak
        x-show="$store.settings.showConfigWarning && claudeConfigStatus.checked && claudeConfigStatus.needsApply"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        class="mb-5 flex flex-wrap items-center gap-3 rounded-[11px] border border-warn-line bg-warn-soft px-4 py-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-warn" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <div class="min-w-0 flex-1">
            <span class="text-[13px] font-medium text-ink" x-text="$store.global.t('claudeConfigNotApplied')">Claude CLI
                not configured</span>
            <span class="ml-1 text-[12px] text-ink-3"
                x-text="'- ' + ($store.global.t('claudeConfigNotAppliedDesc') || 'Apply a preset to use the proxy with Claude Code.')"></span>
        </div>
        <div class="flex items-center gap-2">
            <button type="button" class="btn-action-primary"
                @click="goToClaudeSettings()"
                :title="$store.global.t('configureNow')">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span x-text="$store.global.t('configureNow')">Configure</span>
            </button>
            <button type="button" class="btn-action-ghost-square"
                @click="$store.settings.showConfigWarning = false; $store.settings.saveSettings(true)"
                aria-label="Dismiss warning">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Skeleton Loading (仅在首次加载时显示) -->
    <div x-show="$store.data.initialLoad" class="space-y-6">
        <!-- Skeleton Stats Grid -->
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-5">
            <div class="skeleton-stat-card"></div>
            <div class="skeleton-stat-card"></div>
            <div class="skeleton-stat-card"></div>
            <div class="skeleton-stat-card"></div>
            <div class="skeleton-stat-card col-span-2 sm:col-span-1"></div>
        </div>

        <!-- Skeleton Charts -->
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
            <div class="skeleton-chart"></div>
            <div class="skeleton-chart"></div>
        </div>
    </div>

    <!-- Actual Content (首次加载完成后显示) -->
    <div x-show="!$store.data.initialLoad" class="space-y-6">
        <!-- MetricsBar（kiro2cc metrics.tsx 规格：rounded-[16px] 通栏 + 1px 分隔线 + 28px/700 主值） -->
        <div class="metrics-bar">
            <!-- 段 1：账号总数 -->
            <button type="button" class="metric-cell min-w-0"
                @click="$store.global.activeTab = 'accounts'"
                :title="$store.global.t('clickToViewAllAccounts')">
                <span class="metric-divider" aria-hidden="true"></span>
                <div class="flex items-center gap-1.5 text-[13px] font-medium text-ink-2">
                    <span class="text-ink-3 [&>svg]:h-[14px] [&>svg]:w-[14px]">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </span>
                    <span class="truncate" x-text="$store.global.t('totalAccounts')">Total Accounts</span>
                </div>
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-baseline gap-1.5">
                        <span class="truncate text-[28px] font-bold leading-[1.1] tracking-[-0.02em] tabular-nums"
                            x-text="stats.total">0</span>
                    </div>
                </div>
                <div class="flex min-w-0 flex-wrap items-center gap-2 text-[12px] text-ink-3">
                    <span class="flex items-center">
                        <span class="mr-0.5 inline-block h-1.5 w-1.5 shrink-0 rounded-full bg-ok"></span>
                        <span x-text="stats.active"></span>
                    </span>
                    <span class="h-[9px] w-px shrink-0 bg-hairline-2" aria-hidden="true"></span>
                    <span class="truncate" x-text="$store.global.t('linkedAccounts')">Linked</span>
                    <span class="flex items-center gap-1" x-show="stats.subscription">
                        <template x-if="stats.subscription?.ultra > 0">
                            <span class="status-pill status-pill-ultra">
                                <span x-text="stats.subscription.ultra"></span> <span
                                    x-text="$store.global.t('tierUltra')">Ultra</span>
                            </span>
                        </template>
                        <template x-if="stats.subscription?.pro > 0">
                            <span class="status-pill status-pill-pro">
                                <span x-text="stats.subscription.pro"></span> <span
                                    x-text="$store.global.t('tierPro')">Pro</span>
                            </span>
                        </template>
                        <template x-if="stats.subscription?.free > 0">
                            <span class="status-pill status-pill-free">
                                <span x-text="stats.subscription.free"></span> <span
                                    x-text="$store.global.t('tierFree')">Free</span>
                            </span>
                        </template>
                    </span>
                </div>
            </button>

            <!-- 段 2：Active -->
            <button type="button" class="metric-cell min-w-0"
                @click="$store.global.activeTab = 'models'"
                :title="$store.global.t('clickToViewModels')">
                <span class="metric-divider" aria-hidden="true"></span>
                <div class="flex items-center gap-1.5 text-[13px] font-medium text-ink-2">
                    <span class="text-ink-3 [&>svg]:h-[14px] [&>svg]:w-[14px]">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </span>
                    <span class="truncate" x-text="$store.global.t('active')">Active</span>
                </div>
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-baseline gap-1.5">
                        <span class="truncate text-[28px] font-bold leading-[1.1] tracking-[-0.02em] tabular-nums"
                            x-text="stats.active">0</span>
                    </div>
                </div>
                <div class="flex min-w-0 items-center gap-2 text-[12px] text-ink-3">
                    <span class="mr-0.5 inline-block h-1.5 w-1.5 shrink-0 rounded-full bg-ok"></span>
                    <span class="truncate" x-text="$store.global.t('operational')">Operational</span>
                </div>
            </button>

            <!-- 段 3：Rate Limited -->
            <button type="button" class="metric-cell min-w-0"
                @click="$store.global.activeTab = 'accounts'"
                :title="$store.global.t('clickToViewLimitedAccounts')">
                <span class="metric-divider" aria-hidden="true"></span>
                <div class="flex items-center gap-1.5 text-[13px] font-medium text-ink-2">
                    <span class="text-ink-3 [&>svg]:h-[14px] [&>svg]:w-[14px]">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </span>
                    <span class="truncate" x-text="$store.global.t('rateLimited')">Rate Limited</span>
                </div>
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-baseline gap-1.5">
                        <span class="truncate text-[28px] font-bold leading-[1.1] tracking-[-0.02em] tabular-nums"
                            x-text="stats.limited">0</span>
                    </div>
                </div>
                <div class="flex min-w-0 items-center gap-2 text-[12px] text-ink-3">
                    <span class="mr-0.5 inline-block h-1.5 w-1.5 shrink-0 rounded-full"
                        :class="stats.limited > 0 ? 'bg-danger' : 'bg-ink-3'"></span>
                    <span class="truncate" x-text="$store.global.t('cooldown')">Cooldown</span>
                </div>
            </button>

            <!-- 段 4：Quotas Depleted -->
            <button type="button" class="metric-cell min-w-0"
                @click="$store.global.activeTab = 'models'"
                :title="$store.global.t('clickToViewModels')">
                <span class="metric-divider" aria-hidden="true"></span>
                <div class="flex items-center gap-1.5 text-[13px] font-medium text-ink-2">
                    <span class="text-ink-3 [&>svg]:h-[14px] [&>svg]:w-[14px]">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </span>
                    <span class="truncate" x-text="$store.global.t('quotasDepletedTitle')">Quotas Depleted</span>
                </div>
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-baseline gap-1.5">
                        <span class="truncate text-[28px] font-bold leading-[1.1] tracking-[-0.02em] tabular-nums"
                            x-text="stats.modelUsage ? stats.modelUsage.limited : 0">0</span>
                    </div>
                </div>
                <div class="flex min-w-0 items-center gap-2 text-[12px] text-ink-3">
                    <span class="mr-0.5 inline-block h-1.5 w-1.5 shrink-0 rounded-full"
                        :class="(stats.modelUsage ? stats.modelUsage.limited : 0) > 0 ? 'bg-warn' : 'bg-ink-3'"></span>
                    <span class="truncate"
                        x-text="$store.global.t('outOfTracked', {total: stats.modelUsage ? stats.modelUsage.total : 0})"></span>
                </div>
            </button>

            <!-- 段 5：Global Quota（环形图悬浮右侧，MetricAside 规格） -->
            <div class="metric-cell min-w-0">
                <span class="metric-divider" aria-hidden="true"></span>
                <div class="flex items-center gap-1.5 text-[13px] font-medium text-ink-2">
                    <span class="text-ink-3 [&>svg]:h-[14px] [&>svg]:w-[14px]">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                    </span>
                    <span class="truncate" x-text="$store.global.t('globalQuota')">Global Quota</span>
                </div>
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-baseline gap-1.5">
                        <span class="truncate text-[28px] font-bold leading-[1.1] tracking-[-0.02em] tabular-nums"
                            x-text="stats.overallHealth + '%'">%</span>
                    </div>
                </div>
                <!-- Custom Legend（点击过滤联动，绑定逐字保留） -->
                <div class="flex min-w-0 flex-col gap-1 pr-[76px] text-[12px] text-ink-3">
                    <button type="button"
                        class="flex w-fit items-center gap-1.5 rounded text-left transition-colors hover:text-ink"
                        @click="$store.global.activeTab = 'models'; $nextTick(() => { $store.data.filters.family = 'claude'; $store.data.computeQuotaRows(); })"
                        :title="$store.global.t('clickToFilterClaude')">
                        <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-brand" aria-hidden="true"></span>
                        <span class="truncate" x-text="$store.global.t('familyClaude')">Claude</span>
                    </button>
                    <button type="button"
                        class="flex w-fit items-center gap-1.5 rounded text-left transition-colors hover:text-ink"
                        @click="$store.global.activeTab = 'models'; $nextTick(() => { $store.data.filters.family = 'gemini'; $store.data.computeQuotaRows(); })"
                        :title="$store.global.t('clickToFilterGemini')">
                        <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-ok" aria-hidden="true"></span>
                        <span class="truncate" x-text="$store.global.t('familyGemini')">Gemini</span>
                    </button>
                </div>
                <!-- Chart Aside -->
                <div class="absolute right-[14px] top-1/2 h-14 w-14 -translate-y-1/2 xl:h-16 xl:w-16">
                    <canvas id="quotaChart"></canvas>
                    <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
                        <div class="text-[10px] font-bold tabular-nums text-ink" x-text="stats.overallHealth + '%'">%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Usage Trend Chart -->
        <div class="view-card">
            <!-- Header with Stats and Filter -->
            <div class="view-card-header flex-col items-start gap-4 lg:flex-row lg:items-center lg:justify-between">
                <div class="flex flex-wrap items-center gap-4">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            class="h-4 w-4 text-brand" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                        <h3 class="whitespace-nowrap text-[13px] font-semibold tracking-[-.01em] text-ink"
                            x-text="$store.global.t('requestVolume')">Request Volume</h3>
                    </div>

                    <!-- Usage Stats Pills -->
                    <div class="flex flex-wrap gap-2 text-[11px]">
                        <div class="whitespace-nowrap rounded-[7px] border border-hairline bg-surface-2 px-2 py-0.5">
                            <span class="text-ink-3" x-text="$store.global.t('totalColon')">Total:</span>
                            <span class="ml-1 font-semibold tabular-nums text-ink" x-text="usageStats.total"></span>
                        </div>
                        <div class="whitespace-nowrap rounded-[7px] border border-hairline bg-surface-2 px-2 py-0.5">
                            <span class="text-ink-3" x-text="$store.global.t('todayColon')">Today:</span>
                            <span class="ml-1 font-semibold tabular-nums text-brand" x-text="usageStats.today"></span>
                        </div>
                        <div class="whitespace-nowrap rounded-[7px] border border-hairline bg-surface-2 px-2 py-0.5">
                            <span class="text-ink-3" x-text="$store.global.t('hour1Colon')">1H:</span>
                            <span class="ml-1 font-semibold tabular-nums text-ok" x-text="usageStats.thisHour"></span>
                        </div>
                    </div>
                </div>

                <div
                    class="flex w-full flex-wrap items-center justify-start gap-2 sm:w-auto sm:justify-end lg:flex-nowrap lg:justify-end">
                    <!-- Time Range Dropdown -->
                    <div class="relative flex-1 sm:flex-none">
                        <button @click="showTimeRangeDropdown = !showTimeRangeDropdown; showDisplayModeDropdown = false; showModelFilter = false"
                            class="filter-control">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span x-text="getTimeRangeLabel()"></span>
                            <svg class="h-3 w-3 transition-transform" :class="{'rotate-180': showTimeRangeDropdown}"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div x-show="showTimeRangeDropdown" @click.outside="showTimeRangeDropdown = false"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                            class="absolute right-0 z-50 mt-1 w-36 rounded-[9px] border border-hairline bg-surface py-1 shadow-pop"
                            style="display: none;">
                            <button @click="setTimeRange('1h')" class="filter-control-item"
                                :class="timeRange === '1h' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('last1Hour')"></button>
                            <button @click="setTimeRange('6h')" class="filter-control-item"
                                :class="timeRange === '6h' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('last6Hours')"></button>
                            <button @click="setTimeRange('24h')" class="filter-control-item"
                                :class="timeRange === '24h' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('last24Hours')"></button>
                            <button @click="setTimeRange('7d')" class="filter-control-item"
                                :class="timeRange === '7d' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('last7Days')"></button>
                            <button @click="setTimeRange('all')" class="filter-control-item"
                                :class="timeRange === 'all' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('allTime')"></button>
                        </div>
                    </div>

                    <!-- Display Mode Dropdown -->
                    <div class="relative flex-1 sm:flex-none">
                        <button @click="showDisplayModeDropdown = !showDisplayModeDropdown; showTimeRangeDropdown = false; showModelFilter = false"
                            class="filter-control">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                            </svg>
                            <span x-text="displayMode === 'family' ? $store.global.t('family') : $store.global.t('model')"></span>
                            <svg class="h-3 w-3 transition-transform" :class="{'rotate-180': showDisplayModeDropdown}"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div x-show="showDisplayModeDropdown" @click.outside="showDisplayModeDropdown = false"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                            class="absolute right-0 z-50 mt-1 w-32 rounded-[9px] border border-hairline bg-surface py-1 shadow-pop"
                            style="display: none;">
                            <button @click="setDisplayMode('family')" class="filter-control-item"
                                :class="displayMode === 'family' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('family')"></button>
                            <button @click="setDisplayMode('model')" class="filter-control-item"
                                :class="displayMode === 'model' ? 'text-brand' : 'text-ink-3'"
                                x-text="$store.global.t('model')"></button>
                        </div>
                    </div>

                    <!-- Filter Dropdown -->
                    <div class="relative min-w-[120px] flex-1 sm:flex-none">
                        <button @click="showModelFilter = !showModelFilter; showTimeRangeDropdown = false; showDisplayModeDropdown = false"
                            class="filter-control">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                            </svg>
                            <span x-text="$store.global.t('filter') + ' (' + getSelectedCount() + ')'">Filter (0/0)</span>
                            <svg class="h-3 w-3 transition-transform" :class="{'rotate-180': showModelFilter}" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>

                        <!-- Dropdown Menu -->
                        <div x-show="showModelFilter" @click.outside="showModelFilter = false"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                            class="absolute right-0 z-50 mt-1 w-72 overflow-hidden rounded-[9px] border border-hairline bg-surface shadow-pop"
                            style="display: none;">

                            <!-- Header -->
                            <div class="flex items-center justify-between border-b border-hairline bg-surface-2 px-3 py-2">
                                <span class="text-[10px] font-semibold uppercase tracking-[.07em] text-ink-3"
                                    x-text="displayMode === 'family' ? $store.global.t('selectFamilies') : $store.global.t('selectModels')"></span>
                                <div class="flex gap-1.5">
                                    <button @click="autoSelectTopN(5)" class="text-[11px] text-brand hover:underline"
                                        :title="$store.global.t('smartTitle')" x-text="$store.global.t('frequentModels')">
                                        Smart
                                    </button>
                                    <span class="text-hairline-2" aria-hidden="true">|</span>
                                    <button @click="selectAll()" class="text-[11px] text-brand hover:underline"
                                        x-text="$store.global.t('all')">All</button>
                                    <span class="text-hairline-2" aria-hidden="true">|</span>
                                    <button @click="deselectAll()" class="text-[11px] text-ink-3 hover:underline"
                                        x-text="$store.global.t('none')">None</button>
                                </div>
                            </div>

                            <!-- Hierarchical List -->
                            <div class="max-h-64 space-y-2 overflow-y-auto p-2">
                                <template x-for="family in families" :key="family">
                                    <div class="space-y-1">
                                        <!-- Family Header -->
                                        <label
                                            class="group flex cursor-pointer items-center gap-2 rounded px-2 py-1.5 hover:bg-surface-3"
                                            x-show="displayMode === 'family'">
                                            <input type="checkbox" :checked="isFamilySelected(family)"
                                                @change="toggleFamily(family)"
                                                class="checkbox checkbox-xs checkbox-primary">
                                            <div class="h-2 w-2 shrink-0 rounded-full"
                                                :style="'background-color:' + getFamilyColor(family)"></div>
                                            <span class="text-[12px] font-medium text-ink-2"
                                                x-text="$store.global.t('family' + family.charAt(0).toUpperCase() + family.slice(1))"></span>
                                            <span class="ml-auto text-[11px] tabular-nums text-ink-3"
                                                x-text="'(' + (modelTree[family] || []).length + ')'"></span>
                                        </label>

                                        <!-- Family Section Header (Model Mode) -->
                                        <div class="flex items-center gap-2 px-2 py-1 text-[10px] font-semibold uppercase tracking-[.07em] text-ink-3"
                                            x-show="displayMode === 'model'">
                                            <div class="h-1.5 w-1.5 rounded-full"
                                                :style="'background-color:' + getFamilyColor(family)"></div>
                                            <span
                                                x-text="$store.global.t('family' + family.charAt(0).toUpperCase() + family.slice(1))"></span>
                                        </div>

                                        <!-- Models in Family -->
                                        <template x-if="displayMode === 'model'">
                                            <div class="ml-4 space-y-0.5">
                                                <template x-for="(model, modelIndex) in (modelTree[family] || [])"
                                                    :key="family + ':' + model">
                                                    <label
                                                        class="group flex cursor-pointer items-center gap-2 rounded px-2 py-1 hover:bg-surface-3">
                                                        <input type="checkbox" :checked="isModelSelected(family, model)"
                                                            @change="toggleModel(family, model)"
                                                            class="checkbox checkbox-xs checkbox-primary">
                                                        <div class="h-2 w-2 shrink-0 rounded-full"
                                                            :style="'background-color:' + getModelColor(family, modelIndex)">
                                                        </div>
                                                        <span class="truncate text-[12px] text-ink-2"
                                                            x-text="model"></span>
                                                    </label>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Empty State -->
                                <div x-show="families.length === 0" class="py-4 text-center text-[12px] text-ink-3"
                                    x-text="$store.global.t('noDataTracked')">
                                    No data tracked yet
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Legend -->
            <div class="mb-4 flex flex-wrap gap-3"
                x-show="displayMode === 'family' ? selectedFamilies.length > 0 : Object.values(selectedModels).flat().length > 0">
                <!-- Family Mode Legend -->
                <template x-if="displayMode === 'family'">
                    <template x-for="family in selectedFamilies" :key="family">
                        <div class="flex items-center gap-1.5 text-[11px]">
                            <div class="h-2 w-2 rounded-full" :style="'background-color:' + getFamilyColor(family)"></div>
                            <span class="text-ink-3"
                                x-text="$store.global.t('family' + family.charAt(0).toUpperCase() + family.slice(1))"></span>
                        </div>
                    </template>
                </template>
                <!-- Model Mode Legend -->
                <template x-if="displayMode === 'model'">
                    <template x-for="family in families" :key="'legend-' + family">
                        <template x-for="(model, modelIndex) in (selectedModels[family] || [])" :key="family + ':' + model">
                            <div class="flex items-center gap-1.5 text-[11px]">
                                <div class="h-2 w-2 rounded-full"
                                    :style="'background-color:' + getModelColor(family, modelIndex)"></div>
                                <span class="text-ink-3" x-text="model"></span>
                            </div>
                        </template>
                    </template>
                </template>
            </div>

            <!-- Chart -->
            <div class="relative h-48 w-full">
                <canvas id="usageTrendChart"></canvas>

                <!-- Overall Loading State -->
                <div x-show="!stats.hasTrendData"
                    class="absolute inset-0 z-10 flex items-center justify-center bg-surface/80 backdrop-blur-sm"
                    style="display: none;">
                    <div class="flex items-center gap-2 text-[12px] text-ink-3">
                        <span class="loading loading-spinner loading-xs"></span>
                        <span x-text="$store.global.t('syncing')">SYNCING...</span>
                    </div>
                </div>

                <!-- Empty State (After Filtering) -->
                <div x-show="stats.hasTrendData && !hasFilteredTrendData"
                    class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-surface/60"
                    style="display: none;">
                    <div class="flex flex-col items-center gap-3 animate-fade-in">
                        <div
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-hairline bg-surface-2 text-ink-3">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                        </div>
                        <div class="text-center text-[12px] text-ink-3">
                            <p x-text="$store.global.t('noDataTracked')">No data tracked yet</p>
                            <p class="mt-0.5 text-[10.5px] opacity-70" x-text="'[' + getTimeRangeLabel() + ']'"></p>
                        </div>
                    </div>
                </div>

                <!-- No Selection State -->
                <div x-show="stats.hasTrendData && hasFilteredTrendData && (displayMode === 'family' ? selectedFamilies.length === 0 : Object.values(selectedModels).flat().length === 0)"
                    class="absolute inset-0 z-10 flex items-center justify-center bg-surface/60"
                    style="display: none;">
                    <div class="text-[12px] text-ink-3"
                        x-text="displayMode === 'family' ? $store.global.t('selectFamilies') : $store.global.t('selectModels')">
                    </div>
                </div>
            </div>
        </div>
    </div> <!-- End of x-show="!$store.data.loading" -->
</div>
